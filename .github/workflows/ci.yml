name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (coverage gate 80% on lib/)
        run: pnpm test:unit

      # Later features add, in this order (docs/05_ci_cd.md). These run a throwaway local
      # Supabase inside the GitHub runner, never the hosted project:
      #   pnpm exec supabase start
      #   pnpm exec supabase db reset
      #   pnpm exec supabase test db --local
      #   pnpm test:fn (LLM_PROVIDER=mock)
      #   pnpm seed:demo && pnpm simulate
      #   pnpm exec playwright install --with-deps chromium && pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
